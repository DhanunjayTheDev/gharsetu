version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: gharsetu-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: gharsetu
      MONGO_INITDB_ROOT_PASSWORD: gharsetu_secret

  redis:
    image: redis:7-alpine
    container_name: gharsetu-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: gharsetu-server
    restart: unless-stopped
    ports:
      - '5000:5000'
    depends_on:
      - mongodb
      - redis
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://gharsetu:gharsetu_secret@mongodb:27017/gharsetu?authSource=admin
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-jwt-secret-change-in-production
      JWT_REFRESH_SECRET: your-refresh-secret-change-in-production
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 100

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: gharsetu-client
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - server

volumes:
  mongo-data:
  redis-data:
